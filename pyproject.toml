[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalment"
version = "0.1.0"
description = "Evaluation-first RAG assistant over a structured veterinary note corpus"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]
# Deliberately not required by the core package: the eval harness must run
# with no models installed, so the baseline is always reproducible.
retrieval = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
# Builds the optional Rust BM25 extension. The repository is fully functional
# without it; see crates/signalment_bm25/README.md.
accel = ["maturin>=1.5"]

[project.scripts]
signalment = "signalment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 95
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
# The Rust side is gated on clippy in CI; Python had no equivalent, which read
# as carelessness in a repository that argues for measurement.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
