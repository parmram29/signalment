[package]
name = "vetrag_bm25"
version = "0.1.0"
edition = "2021"
description = "Accelerated BM25 scoring for the vetrag retrieval harness"
license = "MIT"

[lib]
name = "vetrag_bm25"
# cdylib is what Python imports; rlib lets `cargo test` link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Optional so the scoring core can be built and tested with no Python in the
# picture at all: `cargo test --no-default-features` needs no libpython, no
# headers, no interpreter.
pyo3 = { version = "0.29.2", optional = true }

[features]
default = ["python"]
python = ["dep:pyo3", "pyo3/extension-module"]
